<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Kit</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#8b92a5; --accent:#6c8cff; --user:#243056; --bot:#1f232c; --bad:#ff6b6b; --good:#4ade80; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; }
  main { width:100%; max-width:520px; min-height:100vh; padding:16px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:18px; margin:4px 0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, input[type=text] { background:var(--card); color:var(--text); border:1px solid #2a2f3a; border-radius:8px; padding:8px; font-size:14px; }
  input[type=text] { flex:1; }
  label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:4px; }
  #chat { flex:1; display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding:4px 0; }
  .msg { padding:10px 12px; border-radius:12px; max-width:85%; line-height:1.4; font-size:15px; }
  .user { background:var(--user); align-self:flex-end; }
  .bot { background:var(--bot); align-self:flex-start; }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:#2a2f3a; margin-right:4px; }
  .pill.neg { color:var(--bad); } .pill.pos { color:var(--good); }
  #mic { width:84px; height:84px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:32px; cursor:pointer; align-self:center; transition:transform .15s; }
  #mic.rec { background:var(--bad); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  #status { text-align:center; font-size:13px; color:var(--muted); min-height:18px; }
  button.small { background:var(--card); color:var(--text); border:1px solid #2a2f3a; border-radius:8px; padding:8px 12px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>🎙️ Voice Kit</h1>

  <div class="row">
    <select id="lang">
      <option value="">Auto-detect language</option>
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="te">Telugu</option>
      <option value="ta">Tamil</option>
    </select>
    <label><input type="checkbox" id="sentiment"> sentiment</label>
    <label><input type="checkbox" id="translate"> translate→English</label>
    <button class="small" id="reset">New chat</button>
  </div>

  <div id="chat"></div>
  <div id="status">Tap the mic and speak</div>
  <button id="mic" title="Tap to start / stop">🎤</button>

  <div class="row">
    <input type="text" id="text" placeholder="…or type a message (fallback if mic fails)">
    <button class="small" id="send">Send</button>
  </div>
</main>

<script>
const SESSION = "s-" + Math.random().toString(36).slice(2, 8);
const $ = (id) => document.getElementById(id);
const chat = $("chat"), statusEl = $("status"), mic = $("mic");
let recorder, chunks = [], recording = false;

function add(role, text, metaHtml) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  if (metaHtml) { const m = document.createElement("div"); m.className = "meta"; m.innerHTML = metaHtml; d.appendChild(m); }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}

// --- TTS: try ElevenLabs via backend, fall back to the browser voice ---
async function speak(text) {
  try {
    const r = await fetch("/speak", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ text }) });
    if (r.ok) { const a = new Audio(URL.createObjectURL(await r.blob())); await a.play(); return; }
  } catch (e) {}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const lang = $("lang").value; if (lang) u.lang = lang;
  speechSynthesis.speak(u);
}

function pills(mods) {
  let h = "";
  if (mods.sentiment) {
    const s = mods.sentiment, cls = s.sentiment === "negative" ? "neg" : s.sentiment === "positive" ? "pos" : "";
    h += `<span class="pill ${cls}">${s.emotion || s.sentiment} (${s.score ?? "?"})</span>`;
    if (s.escalate) h += `<span class="pill neg">⚠ escalate to human</span>`;
  }
  if (mods.translate) h += `<span class="pill">EN: ${mods.translate.translation}</span>`;
  return h;
}

function handle(data) {
  const lat = data.latency_s ? `${data.latency_s.total}s (stt ${data.latency_s.stt}s · llm ${data.latency_s.llm}s)` : "";
  add("bot", data.reply, pills(data.modules || {}) + (lat ? `<div>${lat}</div>` : ""));
  speak(data.reply);
}

// --- Voice: record -> POST /voice ---
async function toggleRecord() {
  if (!recording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { noiseSuppression: true, echoCancellation: true } });
      recorder = new MediaRecorder(stream); chunks = [];
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = send;
      recorder.start(); recording = true;
      mic.classList.add("rec"); statusEl.textContent = "Listening… tap again to stop";
    } catch (e) { statusEl.textContent = "Mic blocked. Use localhost/https, or type below."; }
  } else {
    recorder.stop(); recorder.stream.getTracks().forEach((t) => t.stop());
    recording = false; mic.classList.remove("rec"); statusEl.textContent = "Thinking…";
  }
}

async function send() {
  const blob = new Blob(chunks, { type: recorder.mimeType });
  const fd = new FormData();
  fd.append("audio", blob, "audio.webm");
  fd.append("session_id", SESSION);
  if ($("lang").value) fd.append("language", $("lang").value);
  const mods = [$("sentiment").checked && "sentiment", $("translate").checked && "translate"].filter(Boolean).join(",");
  fd.append("modules", mods);
  try {
    const r = await fetch("/voice", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "error");
    add("user", data.transcript, `<span class="pill">${data.language || ""}</span>`);
    handle(data); statusEl.textContent = "Tap the mic and speak";
  } catch (e) { statusEl.textContent = "Error: " + e.message; }
}

// --- Text fallback: POST /chat ---
async function sendText() {
  const t = $("text").value.trim(); if (!t) return;
  $("text").value = ""; add("user", t); statusEl.textContent = "Thinking…";
  try {
    const r = await fetch("/chat", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ text: t, session_id: SESSION }) });
    const data = await r.json();
    add("bot", data.reply, `<div>${data.latency_s}s</div>`); speak(data.reply);
    statusEl.textContent = "Tap the mic and speak";
  } catch (e) { statusEl.textContent = "Error: " + e.message; }
}

mic.onclick = toggleRecord;
$("send").onclick = sendText;
$("text").onkeydown = (e) => { if (e.key === "Enter") sendText(); };
$("reset").onclick = async () => { await fetch(`/session/${SESSION}/reset`, { method: "POST" }); chat.innerHTML = ""; };
</script>
</body>
</html>
